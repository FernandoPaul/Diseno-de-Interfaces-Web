<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SportZone: Tienda de deportes online Paul Quillpangui">
    <title>SportZone | Home</title>
    <link rel="stylesheet" href="CSS/styles.css">
</head>
<body>
    <a class="skip-link" href="#main">Saltar el contenido principal</a>
    <header class="site-header">
        <div class="container header-inner">
            <h1 class="brand"><a href="#">SportZone</a></h1>
            <form action="" class="search" role="search" aria-label="Buscardor de productos">
                <label class="se-only" for="q">Buscar</label>
                <input type="search" name="" id="q" placeholder="Buscar productos">
                <button type="submit">Buscar</button>
            </form>
            <button class="btn brn-primary" type="button" id="openModal">Promo</button>
        </div>
    </header>
    <nav class="site-nav" aria-label="Navegación Principal">
        <div class="container nav-inner">
            <a href="#productos">Productos</a>
            <a href="#ofertas">Ofertas</a>
            <a href="#marcas">Marcas</a>
            <a href="#contacto">Contacto</a>
        </div>
    </nav>
    <div class="container page-grid">
        <aside class="sidebar" aria-label="Filtros">
            <div class="filters sticky">
                <fieldset>
                    <legend>Deporte</legend>
                    <label><input type="checkbox">Running</label>
                    <label><input type="checkbox">Fútbol</label>
                    <label><input type="checkbox">Baloncesto</label>
                </fieldset>
                <fieldset>
                    <legend>Talla</legend>
                    <label><input type="checkbox">S</label>
                    <label><input type="checkbox">M</label>
                    <label><input type="checkbox">L</label>
                </fieldset>
            </div>
        </aside>
        <main id="main" class="main">
            <section class="hero">
                <h2>Equípate con la mejor ropa de deporte del mundo</h2>
                <p>Ropa técnica, de deporte y al mejor precio</p>
                <a class="btn btn-primary" href="#productos">Ver productos</a>
            </section>
            <section id="prodcutos" class="productos_section">
                <header class="section-head">
                    <h2>Destacados</h2>
                    <p class="muted">Galeria con Flexbox (cards responsivas)</p>
                </header>
            </section>
        </main>
    </div>
</body>
</html>
